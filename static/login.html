<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>验证登录</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 380px;
            max-width: 90%;
        }

        .login-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .login-title p {
            color: #666;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: border-color 0.2s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .login-button:hover {
            transform: scale(1.02);
        }

        .login-button:active {
            transform: scale(0.98);
        }

        .error-message {
            color: #e53e3e;
            font-size: 14px;
            margin-top: 12px;
            text-align: center;
            display: none;
        }

        .info-text {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 12px;
        }

        /* noscript 警告 */
        .noscript-warning {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #e53e3e;
            color: white;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <!-- noscript 警告（JS禁用时显示） -->
    <noscript>
        <div class="noscript-warning">
            ⚠️ 请启用JavaScript以继续访问
        </div>
    </noscript>

    <div class="login-container">
        <div class="login-title">
            <h1>🔐 服务验证</h1>
            <p>请输入访问密码</p>
        </div>

        <div class="form-group">
            <label>密码</label>
            <input type="password" id="password" placeholder="输入密码" autofocus>
        </div>

        <button class="login-button" id="loginBtn">验证</button>

        <div class="error-message" id="errorMsg">
            密码错误，请重试
        </div>

        <div class="info-text">
            验证通过后将自动跳转
        </div>
    </div>

    <script>
        // 从URL获取重定向地址
        const urlParams = new URLSearchParams(window.location.search);
        const redirectUrl = urlParams.get('redirect') || '/';

        // 解码重定向地址
        const decodedRedirect = decodeURIComponent(redirectUrl);

        // 后端API地址（和auth.js保持一致）
        const API_BASE = 'http://39.107.248.76:8000';

        // 显示错误信息
        const showError = (message) => {
            const errorDiv = document.getElementById('errorMsg');
            errorDiv.textContent = message || '密码错误，请重试';
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 3000);
        };

        // 登录功能
        const login = async () => {
            const password = document.getElementById('password').value;
            const button = document.getElementById('loginBtn');

            if (!password) {
                showError('请输入密码');
                return;
            }

            // 禁用按钮
            button.disabled = true;
            button.textContent = '验证中...';

            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    // 存储token和过期时间（7天）
                    localStorage.setItem('access_token', data.access_token);

                    // 计算过期时间（7天后）
                    const expiryTime = Date.now() + (7 * 24 * 60 * 60 * 1000);
                    localStorage.setItem('token_expiry', expiryTime.toString());

                    // 跳转回原页面
                    window.location.href = decodedRedirect;
                } else {
                    showError(data.message || '密码错误');
                    button.disabled = false;
                    button.textContent = '验证';
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (error) {
                showError('网络错误，请稍后重试');
                button.disabled = false;
                button.textContent = '验证';
            }
        };

        // 绑定事件
        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });

        // 如果已经登录且有token，直接跳转
        if (localStorage.getItem('access_token') && localStorage.getItem('token_expiry')) {
            const expiry = parseInt(localStorage.getItem('token_expiry'));
            if (Date.now() < expiry) {
                // 有有效token，直接跳回
                window.location.href = decodedRedirect;
            }
        }
    </script>
</body>
</html>
